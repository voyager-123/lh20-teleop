# DexPilotOptimizer from the pinned dex-retargeting source, adapted to LH20.
# Five fixed tip frames are derived from the original distal mesh surfaces at
# load time. This does not replace the factory/CAD model or physical calibration.
retargeting:
  type: dexpilot
  urdf_path: models/l20_10_right/linkerhand_l20_10_right.urdf
  add_dummy_free_joint: false
  target_joint_names:
  - thumb_cmc_yaw
  - thumb_cmc_roll
  - thumb_cmc_pitch
  - thumb_mcp
  - index_mcp_roll
  - index_mcp_pitch
  - index_pip
  - middle_mcp_roll
  - middle_mcp_pitch
  - middle_pip
  - ring_mcp_roll
  - ring_mcp_pitch
  - ring_pip
  - pinky_mcp_roll
  - pinky_mcp_pitch
  - pinky_pip
  wrist_link_name: base_link
  finger_tip_link_names:
  - teleop_thumb_tip
  - teleop_index_tip
  - teleop_middle_tip
  - teleop_ring_tip
  - teleop_pinky_tip
  scaling_factor: 1.0
  project_dist: 0.03
  escape_dist: 0.05
  has_joint_limits: true
  ignore_mimic_joint: false
  low_pass_alpha: 0.6
