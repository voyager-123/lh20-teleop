# RIGHT L20-10: segment vectors plus thumb IP-to-tip direction.
# Fixed tip frame is generated from the original mesh; physical CAD stays original.
# The local ThumbResponsiveOptimizer refines three unit directions independently.
# Camera mode adds anatomical root guidance by default; directions restores v2.
retargeting:
  type: vector
  urdf_path: models/l20_10_right/linkerhand_l20_10_right.urdf
  add_dummy_free_joint: false
  target_joint_names:
  - thumb_cmc_yaw
  - thumb_cmc_roll
  - thumb_cmc_pitch
  - thumb_mcp
  - index_mcp_roll
  - index_mcp_pitch
  - index_pip
  - middle_mcp_roll
  - middle_mcp_pitch
  - middle_pip
  - ring_mcp_roll
  - ring_mcp_pitch
  - ring_pip
  - pinky_mcp_roll
  - pinky_mcp_pitch
  - pinky_pip
  target_origin_link_names:
  - thumb_metacarpals
  - thumb_proximal
  - index_proximal
  - index_middle
  - middle_proximal
  - middle_middle
  - ring_proximal
  - ring_middle
  - pinky_proximal
  - pinky_middle
  - thumb_distal
  target_task_link_names:
  - thumb_proximal
  - thumb_distal
  - index_middle
  - index_distal
  - middle_middle
  - middle_distal
  - ring_middle
  - ring_distal
  - pinky_middle
  - pinky_distal
  - teleop_thumb_tip
  target_link_human_indices:
  - - 1
    - 2
    - 5
    - 6
    - 9
    - 10
    - 13
    - 14
    - 17
    - 18
    - 3
  - - 2
    - 3
    - 6
    - 7
    - 10
    - 11
    - 14
    - 15
    - 18
    - 19
    - 4
  scaling_factor: 1.0
  has_joint_limits: true
  ignore_mimic_joint: false
  low_pass_alpha: 0.6
